<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Teste de conexão</title>
</head>
<body>
  <h1>Teste de conexão</h1>
  <ul id="lista"></ul>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      'https://tyjsubzrjqsgrustjtwv.supabase.co',
      'sb_publishable_j0kW02l5e1Z7t0nd_mcGsg_f_-wOWMf'
    );

    (async () => {
      const { data, error } = await supabase
        .from('produtos')
        .select('nome, preco, preco_promocional');
      if (error) { document.body.append(error.message); return; }
      document.getElementById('lista').innerHTML = data
        .map(p => `<li>${p.nome}: R$ ${p.preco_promocional ?? p.preco}</li>`)
        .join('');
    })();
  </script>
</body>
</html>
